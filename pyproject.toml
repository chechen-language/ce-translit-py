[build-system]
requires = ["hatchling >= 1.26"]
build-backend = "hatchling.build"

[project]
name = "ce-translit"
version = "2.0.1"
description = "Transliterate Chechen text from Cyrillic to Latin script using the Chechen Latin alphabet"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "Chechen Language", email = "chechen-language@proton.me"},
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Text Processing :: Linguistic",
]

[project.optional-dependencies]
ai = ["google-genai>=2.29,<3", "httpx>=0.28.1,<1", "pydantic>=2,<3", "uniseg>=0.10.1,<0.11"]

[project.urls]
Homepage = "https://github.com/chechen-language/ce-translit-py"
Repository = "https://github.com/chechen-language/ce-translit-py"
Issues = "https://github.com/chechen-language/ce-translit-py/issues"

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/LICENSE",
    "/README.md",
    "/docs/limitations.md",
    "/docs/contextual-nasalization.md"
]

[tool.hatch.build.targets.wheel]
packages = ["src/ce_translit"]

[tool.hatch.build.targets.wheel.sources]
"src/ce_translit" = "ce_translit"

[tool.hatch.envs.default]
dependencies = ["pytest>=7.0"]

[tool.hatch.envs.default.scripts]
test = "pytest"

[tool.hatch.envs.ai]
features = ["ai"]
dependencies = ["pytest>=7.0"]

[tool.hatch.envs.ai.scripts]
test = "pytest"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: explicit opt-in tests that send text to a configured Gemini endpoint"]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
