name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.13"]
        environment: [core, ai]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install test dependencies
        run: |
          python -m pip install pytest
          if [ "${{ matrix.environment }}" = core ]; then
            python -m pip install -e .
          else
            python -m pip install -e '.[ai]' 'google-genai==2.34.0'
          fi
      - name: Run offline tests
        run: python -m pytest -q
